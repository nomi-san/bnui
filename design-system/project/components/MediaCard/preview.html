<!-- @dsCard group="Content" height=640 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MediaCard</title></head>
<body>
<div class="ds-col">
  <div style="display:grid;grid-template-columns:240px 360px;gap:var(--space-6)">
    <a class="bn-card bn-card--plain" href="#">
      <div class="bn-card__media ds-media--cool"><div class="bn-card__badges"><span class="bn-badge bn-badge--positive">New</span></div><span style="position:absolute;right:4px;bottom:4px;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--radius-full);background:var(--overlay-strong);color:var(--text-primary)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width:14px;height:14px"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></span></div>
      <div class="bn-card__body"><div class="bn-card__eyebrow">Shadows of Avalon</div><h3 class="bn-card__title" style="font:700 14px/17px var(--font-display)">Season Launch Trailer</h3><div class="bn-card__meta">2:16 · 199 views</div></div>
    </a>
    <a class="bn-card bn-card--plain" href="#">
      <div class="bn-card__media ds-media"></div>
      <div class="bn-card__body"><div class="bn-card__eyebrow">Iron Front</div><h3 class="bn-card__title">Enter the battlefields that defined a genre</h3><div class="bn-card__meta">A new campaign with upgraded visuals and performance.</div></div>
    </a>
  </div>
  <a class="bn-card bn-card--horizontal" href="#" style="max-width:820px">
    <div class="bn-card__media ds-media--warm"></div>
    <div class="bn-card__body"><div class="bn-card__eyebrow">Iron Front</div><h3 class="bn-card__title">Iron Front 2</h3><div class="bn-card__callout">Out now</div><div class="bn-card__meta">Action Shooter</div><div class="bn-price" style="margin-top:var(--space-6)">$69.99</div></div>
  </a>
</div>
</body>
</html>
