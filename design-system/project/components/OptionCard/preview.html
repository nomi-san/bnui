<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OptionCard</title></head>
<body>
<div class="ds-col" style="max-width:420px">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="bn-label">Select a product</span><a class="bn-link" href="#">Compare</a></div>
  <div class="bn-options" role="radiogroup">
    <button class="bn-option" role="radio" aria-checked="true"><span class="bn-option__name">Vault Edition</span><span class="bn-price">$99.99</span></button>
    <button class="bn-option" role="radio" aria-checked="false"><span class="bn-option__name">Standard Edition</span><span class="bn-price">$69.99</span></button>
  </div>
</div>
</body>
</html>
