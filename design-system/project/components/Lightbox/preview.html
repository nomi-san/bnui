<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lightbox</title></head>
<body>
<div class="bn-backdrop bn-backdrop--inline" style="height:400px;padding:0;place-items:stretch">
  <div class="bn-lightbox">
    <div class="bn-lightbox__bar"><span class="bn-badge bn-badge--neutral">3 / 18</span><button class="bn-icon-btn bn-icon-btn--ghost bn-lightbox__close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="bn-lightbox__stage" style="position:relative">
      <div class="bn-lightbox__media ds-media--cool" style="max-width:520px"></div>
      <button class="bn-icon-btn bn-icon-btn--tall" aria-label="Previous" style="position:absolute;left:var(--space-6);top:40%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="bn-icon-btn bn-icon-btn--tall" aria-label="Next" style="position:absolute;right:var(--space-6);top:40%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
