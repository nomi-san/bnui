<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressRing</title></head>
<body>
<div class="ds-row" style="gap:var(--space-12)">
  <div class="bn-ring"><svg viewBox="0 0 160 160"><circle class="bn-ring__track" cx="80" cy="80" r="76"/><circle class="bn-ring__value" cx="80" cy="80" r="76" stroke-dasharray="157.6 477.5"/></svg><div class="bn-ring__label"><span class="bn-ring__number">33%</span><span class="bn-ring__caption">Complete</span></div></div>

</div>
</body>
</html>
