<!-- @dsCard group="Promotion" height=470 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>HeroCarousel</title></head>
<body>
<div class="ds-col">
  <div class="bn-hero">
    <div class="bn-hero__slide" style="--hero-tone:#1b2230">
      <div class="bn-hero__art ds-media--cool"></div>
      <div class="bn-hero__scrim"></div>
      <div class="bn-hero__content">
        <div class="bn-hero__logo" style="display:grid;place-items:center;border-radius:var(--radius-md);background:var(--fill);color:var(--text-muted);font:700 12px/14px var(--font-display);letter-spacing:.6px">320 × 168 LOGO</div>
        <h2 class="bn-hero__title">Become a legendary monster slayer</h2>
        <p class="bn-hero__text">Includes the base game and both expansions.</p>
        <a class="bn-btn bn-btn--primary" href="#">Buy Now</a>
      </div>
      <button class="bn-icon-btn bn-icon-btn--tall bn-hero__arrow bn-hero__arrow--prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="bn-icon-btn bn-icon-btn--tall bn-hero__arrow bn-hero__arrow--next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="bn-icon-btn bn-icon-btn--ghost bn-hero__pause" aria-label="Pause" style="width:24px;height:24px"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width:14px;height:14px"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    </div>
    <div class="bn-hero__controls"><div class="bn-dots"><button class="bn-dot" aria-current="true" aria-label="Slide 1"></button><button class="bn-dot" aria-label="Slide 2"></button><button class="bn-dot" aria-label="Slide 3"></button><button class="bn-dot" aria-label="Slide 4"></button></div></div>
  </div>
</div>
</body>
</html>
