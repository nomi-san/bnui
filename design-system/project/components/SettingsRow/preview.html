<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SettingsRow</title></head>
<body>
<div class="ds-col" style="max-width:860px">
  <div class="bn-panel"><div class="bn-panel__head"><h2 class="bn-panel__title">Social Settings</h2><a class="bn-link bn-panel__link" href="#">Update</a></div>
  <div class="bn-panel__body" style="padding-top:0;padding-bottom:0">
    <div class="bn-setting"><div><div class="bn-setting__title">Text Chat</div><div class="bn-setting__desc">Allow chat in groups, player channels and private messages.</div></div><div class="bn-setting__status bn-setting__status--on"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg> Enabled</div></div>
    <div class="bn-setting"><div><div class="bn-setting__title">Private Text Chat</div><div class="bn-setting__desc">Who can send you private messages.</div></div><div class="bn-setting__status">Everybody</div></div>
    <div class="bn-setting"><div><div class="bn-setting__title">News and Special Offers</div><div class="bn-setting__desc">Receive news, event information and offers by email.</div></div><div class="bn-setting__status"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1Z"/></svg> Disabled</div></div>
  </div></div>
</div>
</body>
</html>
