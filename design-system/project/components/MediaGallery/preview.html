<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MediaGallery</title></head>
<body>
<div class="ds-row" style="display:block">
  <div class="bn-gallery" style="height:338px">
    <div class="bn-gallery__rail">
      <button class="bn-gallery__thumb ds-media--warm" aria-current="true" aria-label="Screenshot 1"></button>
      <button class="bn-gallery__thumb ds-media" aria-label="Screenshot 2"></button>
      <button class="bn-gallery__thumb ds-media--cool" aria-label="Trailer"><span class="bn-play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></span></button>
      <button class="bn-gallery__thumb ds-media" aria-label="Screenshot 4"></button>
      <button class="bn-gallery__thumb ds-media--warm" aria-label="Trailer 2"><span class="bn-play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></span></button>
      <button class="bn-gallery__thumb ds-media--cool" aria-label="Screenshot 6"></button>
    </div>
    <div class="bn-gallery__stage ds-media--warm">
      <button class="bn-icon-btn bn-icon-btn--tall bn-gallery__arrow bn-gallery__arrow--prev" aria-label="Previous" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="bn-icon-btn bn-icon-btn--tall bn-gallery__arrow bn-gallery__arrow--next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="bn-badge bn-badge--neutral bn-gallery__counter">1 / 18</span>
    </div>
  </div>
</div>
</body>
</html>
