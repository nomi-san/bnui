<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div class="ds-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
  <section class="bn-panel"><div class="bn-panel__head"><h2 class="bn-panel__title">Redeem a code</h2></div><div class="bn-panel__body"><div style="display:flex;gap:var(--space-4)"><input class="bn-field" placeholder="XXXX-XXXX-XXXX-XXXX"><button class="bn-btn bn-btn--primary">Redeem Code</button></div></div></section>
  <section class="bn-panel"><div class="bn-panel__head"><h2 class="bn-panel__title">Balance</h2><a class="bn-link bn-panel__link" href="#">Payment Methods <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></div><div class="bn-panel__body"><span style="font:400 24px/32px var(--font-body);color:var(--success)">$0.00</span></div></section>
</div>
</body>
</html>
