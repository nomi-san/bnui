<!-- @dsCard group="Feedback" height=270 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="ds-col" style="align-items:flex-end;gap:var(--space-2)">
  <div class="bn-toast bn-toast--success" role="status"><span class="bn-toast__strip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg></span><div class="bn-toast__content"><span class="bn-toast__title">Download complete</span><span>Shadows of Avalon is ready to play.</span></div><button class="bn-toast__close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="bn-toast" role="status"><span class="bn-toast__strip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span><div class="bn-toast__content"><span class="bn-toast__title">Kestrel is online</span><a class="bn-toast__action" href="#">Start Chat</a></div><button class="bn-toast__close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="bn-toast bn-toast--danger" role="alert"><span class="bn-toast__strip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1Z"/></svg></span><div class="bn-toast__content"><span class="bn-toast__title">Update failed</span><span>Check your connection and try again.</span></div><button class="bn-toast__close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
</div>
</body>
</html>
