<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox</title></head>
<body>
<div class="ds-col" style="gap:var(--space-3)">
  <label class="bn-check"><input type="checkbox"><span class="bn-check__box"></span><span class="bn-check__text">Launch when I start my computer</span></label>
  <label class="bn-check bn-check--nested"><input type="checkbox" disabled><span class="bn-check__box"></span><span class="bn-check__text">Launch minimized to the system tray</span></label>
  <label class="bn-check"><input type="checkbox" checked><span class="bn-check__box"></span><span class="bn-check__text">Automatically create a desktop icon for games</span></label>
  <label class="bn-check bn-check--nested"><input type="checkbox" checked><span class="bn-check__box"></span><span class="bn-check__text">Create desktop icon for all users on this machine</span></label>
</div>
</body>
</html>
