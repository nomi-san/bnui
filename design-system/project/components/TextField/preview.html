<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="ds-col" style="max-width:420px">
  <label class="bn-field-group"><span class="bn-label">Email or Phone</span><input class="bn-field" placeholder="Email or Phone"></label>
  <label class="bn-field-group"><span class="bn-label">Redeem a code</span><input class="bn-field" value="ABCD-1234" style="border-color:var(--accent)"><span class="bn-help">Focused: the border turns accent.</span></label>
  <label class="bn-field-group"><span class="bn-label">Pre-release content (KB/s)</span><input class="bn-field bn-field--error" value="99999"><span class="bn-help bn-help--error">Enter a value between 1 and 10000.</span></label>
  <div class="bn-field-wrap"><input class="bn-field bn-field--search" placeholder="Search games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
</div>
</body>
</html>
