<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Radio</title></head>
<body>
<div class="ds-col" style="gap:var(--space-3)" role="radiogroup" aria-label="Voice chat">
  <span class="bn-label">Voice chat</span>
  <label class="bn-radio"><input type="radio" name="v"><span class="bn-radio__dot"></span><span class="bn-radio__text">Off</span></label>
  <label class="bn-radio"><input type="radio" name="v"><span class="bn-radio__dot"></span><span class="bn-radio__text">Listening only</span></label>
  <label class="bn-radio"><input type="radio" name="v" checked><span class="bn-radio__dot"></span><span class="bn-radio__text">Listening &amp; Speaking</span></label>
</div>
</body>
</html>
