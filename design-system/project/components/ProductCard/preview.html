<!-- @dsCard group="Content" height=500 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProductCard</title></head>
<body>
<div class="ds-grid" style="grid-template-columns:repeat(2,280px)">
  <a class="bn-card" href="#">
    <div class="bn-card__media ds-media"><div class="bn-card__badges"><span class="bn-badge bn-badge--urgent">Pre-purchase</span></div></div>
    <div class="bn-card__body">
      <div class="bn-card__eyebrow"><span style="width:20px;height:20px;border-radius:var(--radius-full);background:var(--fill-strong)"></span>Shadows of Avalon</div>
      <h3 class="bn-card__title">Shadows of Avalon: Ultimate Edition</h3>
      <div class="bn-card__callout">Available November 4! Pre-purchase to get early access to the beta.</div>
      <div class="bn-card__meta">Action RPG</div>
    </div>
    <div class="bn-card__foot"><span class="bn-price"><span class="bn-price__prefix">From</span>$29.99</span></div>
  </a>
  <a class="bn-card" href="#">
    <div class="bn-card__media ds-media--warm"><div class="bn-card__badges"><span class="bn-badge bn-badge--positive">New</span></div></div>
    <div class="bn-card__body">
      <div class="bn-card__eyebrow"><span style="width:20px;height:20px;border-radius:var(--radius-full);background:var(--fill-strong)"></span>Iron Front</div>
      <h3 class="bn-card__title">Iron Front<sup>®</sup> 2</h3>
      <div class="bn-card__meta">Action Shooter</div>
    </div>
    <div class="bn-card__foot"><span class="bn-price">$69.99</span></div>
  </a>
</div>
</body>
</html>
