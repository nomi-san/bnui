<!-- @dsCard group="Promotion" height=150 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AnnouncementBanner</title></head>
<body>
<div style="padding:var(--space-6) 0">
  <div class="bn-announce" style="position:relative">
    <div class="bn-announce__art ds-media"></div>
    <div class="bn-announce__inner">
      <div class="bn-announce__lead"><div class="bn-announce__icon" style="border-radius:var(--radius-md);background:var(--fill-strong)"></div><div><div class="bn-announce__title">Shadows of Avalon is coming in:</div><div class="bn-announce__text">Pre-purchase the Founders Pack and play the beta today.</div></div></div>
      <div class="bn-countdown"><div class="bn-countdown__unit"><span class="bn-countdown__tile">33</span></div><span class="bn-countdown__sep">:</span><div class="bn-countdown__unit"><span class="bn-countdown__tile">08</span></div><span class="bn-countdown__sep">:</span><div class="bn-countdown__unit"><span class="bn-countdown__tile">41</span></div><span class="bn-countdown__sep">:</span><div class="bn-countdown__unit"><span class="bn-countdown__tile">50</span></div></div>
      <a class="bn-btn bn-btn--primary bn-announce__cta" href="#">Pre-purchase</a>
    </div>
    <button class="bn-icon-btn bn-icon-btn--ghost bn-announce__close" aria-label="Close" style="width:24px;height:24px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width:16px;height:16px"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
</body>
</html>
