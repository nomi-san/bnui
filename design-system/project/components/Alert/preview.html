<!-- @dsCard group="Feedback" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert</title></head>
<body>
<div class="ds-col" style="max-width:560px;gap:var(--space-3)">
  <div class="bn-alert bn-alert--info" role="status"><span class="bn-alert__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span><div class="bn-alert__content"><span class="bn-alert__title">Update available</span><span>A new version installs the next time you restart the app.</span></div><button class="bn-alert__close" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="bn-alert bn-alert--success" role="status"><span class="bn-alert__icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg></span><div class="bn-alert__content"><span>Your code was redeemed. The content is now in your library.</span></div></div>
  <div class="bn-alert bn-alert--warning" role="status"><span class="bn-alert__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span><div class="bn-alert__content"><span>Add a phone number to secure your account.</span></div></div>
  <div class="bn-alert bn-alert--danger" role="alert"><span class="bn-alert__icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1Z"/></svg></span><div class="bn-alert__content"><span>That code has already been used.</span></div></div>
</div>
</body>
</html>
