<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="ds-row" style="align-items:flex-start;gap:var(--space-8)">
  <div class="bn-field-group" style="width:260px">
    <span class="bn-label">Private text chat</span>
    <button class="bn-select" aria-expanded="false">Everybody <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="bn-field-group" style="width:260px">
    <span class="bn-label">On startup, view</span>
    <button class="bn-select bn-select--filled" aria-expanded="true">Home Page <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <ul class="bn-menu" role="listbox" style="margin-top:-4px">
      <li class="bn-menu__item" role="option" aria-selected="true">Home Page</li>
      <li class="bn-menu__item" role="option">Last Viewed Game Page</li>
    </ul>
  </div>
