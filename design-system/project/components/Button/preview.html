<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ds-col">
  <div class="ds-row" style="padding:0">
    <button class="bn-btn bn-btn--primary">Buy Now</button>
    <button class="bn-btn">Learn More</button>
    <button class="bn-btn bn-btn--tertiary">Visit Shop</button>
    <button class="bn-btn bn-btn--ghost">Compare</button>
    <button class="bn-btn bn-btn--primary" disabled>Purchased</button>
  </div>
  <div class="ds-row" style="padding:0">
    <button class="bn-btn bn-btn--primary bn-btn--sm">Small</button>
    <button class="bn-btn bn-btn--md">Reset to Defaults</button>
    <button class="bn-btn bn-btn--primary bn-btn--md">Done</button>
    <button class="bn-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg> Download for Windows</button>
  </div>
  <div style="width:272px"><button class="bn-btn bn-btn--primary bn-btn--xl bn-btn--block">Install</button></div>
</div>
</body>
</html>
